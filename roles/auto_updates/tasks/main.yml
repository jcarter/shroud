---
- name: Install automatic updates packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
      - needrestart
    state: present
    update_cache: false
  register: auto_updates_package

- name: Configure and start automatic updates
  when: not ansible_check_mode or not auto_updates_package.changed
  block:
    - name: Deploy APT periodic config (20auto-upgrades)
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        owner: root
        group: root

    - name: Deploy unattended-upgrades config (50unattended-upgrades)
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: '0644'
        owner: root
        group: root

    - name: Deploy needrestart config
      ansible.builtin.template:
        src: needrestart.conf.j2
        dest: /etc/needrestart/conf.d/50-shroud.conf
        mode: '0644'
        owner: root
        group: root

    - name: Enable and start unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started
