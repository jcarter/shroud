---
# failed_when: false because a service may not be installed on every host; the task is then a no-op.

- name: Set avahi-daemon (mDNS) state
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: "{{ avahi_enabled | bool }}"
    state: "{{ 'started' if avahi_enabled | bool else 'stopped' }}"
  failed_when: false

- name: Set bluetooth state
  ansible.builtin.systemd:
    name: bluetooth
    enabled: "{{ bluetooth_enabled | bool }}"
    state: "{{ 'started' if bluetooth_enabled | bool else 'stopped' }}"
  failed_when: false

- name: Set Samba services state
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ samba_enabled | bool }}"
    state: "{{ 'started' if samba_enabled | bool else 'stopped' }}"
  loop:
    - nmbd
    - smbd
    - winbind
  failed_when: false
