---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: false
  register: fail2ban_package

- name: Configure and start fail2ban
  when: not ansible_check_mode or not fail2ban_package.changed
  block:
    - name: Deploy fail2ban jail.local
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        mode: '0644'
        owner: root
        group: root
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
