---
- name: Add Tailscale archive keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  register: tailscale_keyring

- name: Add Tailscale apt source list
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'
  register: tailscale_repository

- name: Update apt cache after Tailscale repository changes
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_keyring.changed or tailscale_repository.changed

# A new repository is only predicted in check mode, so apt cannot use it yet.
- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: false
  when: not ansible_check_mode or not (tailscale_keyring.changed or tailscale_repository.changed)

- name: Check whether Tailscale is installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary

- name: Start Tailscale and establish tailnet access
  when: not ansible_check_mode or tailscale_binary.stat.exists
  block:
    - name: Enable and start tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Get current Tailscale backend state
      ansible.builtin.command: tailscale status --json
      check_mode: false
      register: _ts_status_raw
      changed_when: false
      failed_when: false

    - name: Parse Tailscale backend state
      ansible.builtin.set_fact:
        _ts_backend_state: >-
          {{
            (_ts_status_raw.stdout | from_json).BackendState | default('Stopped')
            if _ts_status_raw.rc == 0 and _ts_status_raw.stdout | trim | length > 0
            else 'Stopped'
          }}

    - name: Join tailnet with auth key
      ansible.builtin.shell: >
        tailscale up
        --authkey='{{ tailscale_authkey }}'
        {{ tailscale_up_flags }}
        {{ '--ssh' if tailscale_ssh_enabled | bool else '' }}
      no_log: true
      when:
        - not ansible_check_mode
        - _ts_backend_state != 'Running'
        - tailscale_authkey is defined
        - tailscale_authkey | length > 0
      changed_when: true

    # Check mode cannot start or join Tailscale. Only poll an already running node.
    - name: Confirm Tailscale has an IPv4 address
      when: not ansible_check_mode or _ts_backend_state == 'Running'
      block:
        - name: Wait for Tailscale to obtain an IP address
          ansible.builtin.command: tailscale ip -4
          check_mode: false
          register: _ts_ip_poll
          until: _ts_ip_poll.rc == 0 and _ts_ip_poll.stdout | trim | length > 0
          retries: 12
          delay: 5
          changed_when: false

        - name: Display Tailscale IP
          ansible.builtin.debug:
            msg: "Tailscale IP: {{ _ts_ip_poll.stdout | trim }}"
