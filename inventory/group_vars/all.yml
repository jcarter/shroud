---
# =============================================================================
# devsec.hardening — ssh_hardening role variables
# https://github.com/dev-sec/ansible-collection-hardening
# Names must match devsec's defaults/main.yml; unknown names are silently ignored.
# =============================================================================
ssh_permit_root_login: "no"
ssh_server_password_login: false
ssh_challengeresponseauthentication: false
ssh_use_pam: true   # Session setup only (logind, loginuid for auditd); devsec still renders AuthenticationMethods publickey
ssh_x11_forwarding: false
ssh_max_auth_retries: 3
ssh_login_grace_time: 20
ssh_client_alive_interval: 300
ssh_client_alive_count: 2
ssh_allowed_users:
  - deploy    # must include ansible_user; hosts override this list in local.yml
ssh_allow_users: "{{ ssh_allowed_users | join(' ') }}"   # devsec renders this as AllowUsers
sftp_enabled: true

# =============================================================================
# devsec.hardening — os_hardening role variables
# =============================================================================
# CRITICAL: Docker requires IP forwarding — must NOT be disabled by devsec.
sysctl_overwrite:
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.forwarding: 0
os_auth_pw_max_age: 99999   # Disable forced password rotation; SSH uses keys and Tailscale-only access

# =============================================================================
# Shared inventory policy
# These values are consumed by standalone playbooks as well as the Dokploy role.
# =============================================================================
dokploy_install: false
dokploy_docker_dns_servers:
  - "100.100.100.100"         # Tailscale Quad100; stable Docker DNS with MagicDNS support
