---
# Run after harden.yml to verify services and managed configuration. See README for usage.

- name: Verify server hardening
  hosts: all
  gather_facts: false
  become: true
  # Every task is read-only; collect actual state even when invoked with --check.
  check_mode: false

  tasks:
    # ------------------------------------------------------------------ UFW
    - name: Get UFW status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active
      ansible.builtin.assert:
        that: "'Status: active' in ufw_status.stdout"
        fail_msg: "FAIL — UFW is not active"
        success_msg: "PASS — UFW is active"

    - name: Display UFW rules
      ansible.builtin.debug:
        var: ufw_status.stdout_lines
        verbosity: 1

    # ------------------------------------------------------------------ Tailscale
    - name: Get Tailscale status as JSON
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false

    - name: Parse Tailscale status
      ansible.builtin.set_fact:
        tailscale_status_json: "{{ tailscale_status.stdout | from_json }}"

    - name: Get Tailscale IPv4 address
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Assert Tailscale is running with an IPv4 address
      ansible.builtin.assert:
        that:
          - tailscale_status_json.BackendState | default('') == 'Running'
          - tailscale_ip.stdout | trim | length > 0
        fail_msg: "FAIL — Tailscale is not running or has no IPv4 address (state: {{ tailscale_status_json.BackendState | default('unknown') }}, IP: {{ tailscale_ip.stdout | trim }})"
        success_msg: "PASS — Tailscale is running (IP: {{ tailscale_ip.stdout | trim }})"

    - name: Display Tailscale status
      ansible.builtin.debug:
        var: tailscale_status_json
        verbosity: 1

    # ------------------------------------------------------------------ services
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required security services are active
      ansible.builtin.assert:
        that:
          - "(item + '.service') in ansible_facts.services"
          - "ansible_facts.services[item + '.service'].state == 'running'"
        fail_msg: >-
          FAIL — {{ item }} is {{
            ansible_facts.services[item + '.service'].state
            if (item + '.service') in ansible_facts.services
            else 'missing from service facts'
          }}
        success_msg: "PASS — {{ item }} is running"
      loop:
        - fail2ban
        - auditd
        - unattended-upgrades
      loop_control:
        label: "{{ item }}"

    # ------------------------------------------------------------------ security updates
    - name: Simulate a full upgrade
      ansible.builtin.command: apt-get -s dist-upgrade
      register: apt_simulation
      changed_when: false

    - name: Assert no security updates are pending
      vars:
        pending_security: "{{ apt_simulation.stdout_lines | select('search', '^Inst .*-security') | map('regex_replace', '^Inst (\\S+).*', '\\1') | list }}"
      ansible.builtin.assert:
        that: pending_security | length == 0
        fail_msg: >-
          FAIL — {{ pending_security | length }} security updates pending: {{ pending_security | join(', ') }}.
          unattended-upgrades installs these daily; if this persists past a day it is not matching the security repo.
        success_msg: "PASS — no security updates pending"

    # ------------------------------------------------------------------ fail2ban
    - name: Check fail2ban SSH jail status
      ansible.builtin.command: fail2ban-client status sshd
      register: fail2ban_ssh
      changed_when: false

    - name: Display fail2ban SSH jail
      ansible.builtin.debug:
        var: fail2ban_ssh.stdout_lines
        verbosity: 1

    # ------------------------------------------------------------------ auditd
    - name: Check loaded audit rules
      ansible.builtin.command: auditctl -l
      register: audit_rules
      changed_when: false

    - name: Assert expected audit rule keys are loaded
      ansible.builtin.assert:
        that: "audit_rules.stdout is search('(?:-k |key=)' ~ item ~ '(?:\\s|$)')"
        fail_msg: "FAIL — audit rule key '{{ item }}' is not loaded"
        success_msg: "PASS — audit rule key '{{ item }}' is loaded"
      loop:
        - identity
        - pam
        - priv_esc
        - module_insertion
        - network_modification
        - time_change
        - file_deletion
        - access
        - logins
        - sshd_config
      loop_control:
        label: "{{ item }}"

    - name: Display loaded audit rules
      ansible.builtin.debug:
        var: audit_rules.stdout_lines
        verbosity: 1

    # ------------------------------------------------------------------ sysctl
    - name: Check critical sysctl values
      ansible.builtin.command: "sysctl -n {{ item.key }}"
      register: sysctl_results
      loop:
        - {key: "net.ipv4.ip_forward",              expected: "1"}
        - {key: "kernel.randomize_va_space",         expected: "2"}
        - {key: "net.ipv4.conf.all.rp_filter",       expected: "1"}
        - {key: "net.ipv4.conf.all.accept_redirects", expected: "0"}
      changed_when: false
      loop_control:
        label: "{{ item.key }}"

    - name: Assert sysctl values
      ansible.builtin.assert:
        that: "item.stdout | trim == item.item.expected"
        fail_msg: "FAIL — {{ item.item.key }} = {{ item.stdout | trim }} (expected {{ item.item.expected }})"
        success_msg: "PASS — {{ item.item.key }} = {{ item.stdout | trim }}"
      loop: "{{ sysctl_results.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    # ------------------------------------------------------------------ listening ports
    - name: List listening ports
      ansible.builtin.command: ss -tlnp
      register: listening_ports
      changed_when: false

    - name: Display listening ports
      ansible.builtin.debug:
        var: listening_ports.stdout_lines
        verbosity: 1

    # ------------------------------------------------------------------ dokploy
    - name: Optional Dokploy verification
      when: dokploy_install | bool
      block:
        - name: Check Dokploy Swarm service is deployed
          ansible.builtin.command: docker service inspect dokploy
          changed_when: false

        - name: Verify managed Docker DNS configuration
          when: dokploy_docker_dns_servers | length > 0
          block:
            - name: Validate Docker daemon configuration
              ansible.builtin.command: dockerd --validate --config-file=/etc/docker/daemon.json
              changed_when: false

            - name: Read Docker daemon configuration
              ansible.builtin.slurp:
                src: /etc/docker/daemon.json
              register: docker_daemon_config_file

            - name: Assert Docker uses the configured DNS servers
              ansible.builtin.assert:
                that: >-
                  (docker_daemon_config_file.content | b64decode | from_json).dns
                  == dokploy_docker_dns_servers
                fail_msg: "FAIL — Docker DNS servers do not match dokploy_docker_dns_servers"
                success_msg: "PASS — Docker uses the configured stable DNS servers"
